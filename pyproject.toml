[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ox-alpha-review-py"
version = "0.1.0"
description = "Free-only Ox Alpha GitHub pull-request review app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2024.2.2",
  "fastapi>=0.110",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "pyjwt[crypto]>=2.8",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
]

[project.scripts]
ox-alpha-review = "ox_alpha_review.main:run"
ox-alpha-review-accept = "ox_alpha_review.acceptance:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP042"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["ox_alpha_review", "reviewbot_common"]
mypy_path = "src"
